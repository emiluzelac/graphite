name: Deploy registry to GitHub Pages

on:
  push:
    branches: [main]
  # Branch protection on main requires the "deploy" check, so pull requests
  # run the same job. They stop after the verification steps and never
  # publish: the Pages steps and the github-pages environment are push-only.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pull requests get their own group, so a PR run can never cancel a live
  # Pages deploy (or be cancelled by one).
  group: ${{ github.event_name == 'pull_request' && format('verify-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name != 'pull_request' && 'github-pages' || '' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned npm for the reviewed lock format
        run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run registry:build
      - run: npm run smoke:registry
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # upload-pages-artifact pins its nested actions/upload-artifact by SHA.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
