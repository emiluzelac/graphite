name: CI

# Pull requests opened on GitHub only. Since 2026-11-15 Graphite's canonical
# repository, its CI and its publishing are on a private Forgejo, which mirrors
# every push here; this keeps a check for an outside contributor's pull
# request, on GitHub-hosted runners (a public repository never runs on the
# maintainer's machines). A change that lands goes in through Forgejo.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install pinned npm for the reviewed lock format
        run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run registry:build
      - run: npm run smoke:registry
