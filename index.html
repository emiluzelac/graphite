<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphite — Headless UI, beautifully composed</title>
    <meta
      name="description"
      content="Accessible React components built on Headless UI, with Graphite's signature glass finish. Copy the source, keep your own theme, and make it yours."
    />
    <script>
      // Avoid FOUC: apply theme before first paint.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var isDark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
